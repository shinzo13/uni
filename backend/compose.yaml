services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: ${UNI_DB_PASSWORD:-uni}
      POSTGRES_DB: uni
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    profiles: ["api"]
    env_file: .env
    environment:
      UNI_DATABASE_URL: postgresql+asyncpg://uni:${UNI_DB_PASSWORD:-uni}@db:5432/uni
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
